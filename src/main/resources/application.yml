spring:
  application:
    name: identitycore

  datasource:
    url: jdbc:postgresql://localhost:5432/identitycore
    username: ${DB_USERNAME:identitycore}
    password: ${DB_PASSWORD:identitycore}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  private-key: ${JWT_PRIVATE_KEY_B64}
  public-key: ${JWT_PUBLIC_KEY_B64}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS}

logging:
  level:
    root: INFO
    com.example.identitycore: DEBUG